<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Tracker - Live Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold text-white tracking-tight">MFA Sports Live Tracker</h1>
          <span id="liveBadge" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Live Proxy
          </span>
        </div>
        <p class="text-sm text-slate-400">Direct on-demand inventory extraction & stock finder</p>
      </div>
      <div id="lastUpdated" class="text-xs text-slate-500 font-mono">Connecting...</div>
    </header>

    <!-- Top KPI Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-[#1e293b]/70 border border-slate-700/80 rounded-xl p-5 shadow-lg flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-slate-400 font-medium">Loaded Products</p>
          <h2 id="totalCount" class="text-3xl font-extrabold text-white mt-1">—</h2>
        </div>
        <div class="p-3 bg-blue-500/10 text-blue-400 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        </div>
      </div>

      <div class="bg-[#1e293b]/70 border border-slate-700/80 rounded-xl p-5 shadow-lg flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-slate-400 font-medium">In-Stock Filter Status</p>
          <h2 id="filterLabel" class="text-xl font-bold text-emerald-400 mt-1">Showing All Sizes</h2>
        </div>
        <button onclick="fetchLiveData()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow transition">
          Refresh Live
        </button>
      </div>
    </div>

    <!-- Controls: Search, Sort, & Quick Size Buttons -->
    <div class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-3">
        <input
          type="text"
          id="searchInput"
          placeholder="Search jerseys, clubs, editions..."
          class="flex-1 px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <select
          id="sortSelect"
          class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="default">Sort By: Default</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="discount-desc">Highest Discount</option>
        </select>
      </div>

      <!-- Quick Size Filters -->
      <div class="flex items-center gap-2 flex-wrap text-xs">
        <span class="text-slate-400 font-medium mr-1">Find In-Stock Size:</span>
        <button onclick="filterBySize('ALL')" class="size-btn px-3 py-1 rounded bg-blue-600 text-white font-semibold">ALL</button>
        <button onclick="filterBySize('S')" class="size-btn px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300">S</button>
        <button onclick="filterBySize('M')" class="size-btn px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300">M</button>
        <button onclick="filterBySize('L')" class="size-btn px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300">L</button>
        <button onclick="filterBySize('XL')" class="size-btn px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300">XL</button>
        <button onclick="filterBySize('XXL')" class="size-btn px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300">XXL</button>
        <button onclick="filterBySize('3XL')" class="size-btn px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300">3XL</button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="bg-[#1e293b]/60 border border-slate-700 rounded-xl overflow-hidden shadow-2xl backdrop-blur">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-[#1e293b] uppercase text-xs text-slate-400 tracking-wider border-b border-slate-700">
            <tr>
              <th class="py-3.5 px-4 min-w-[200px]">Product Name</th>
              <th class="py-3.5 px-3">Price</th>
              <th class="py-3.5 px-3">Original</th>
              <th class="py-3.5 px-3">Discount</th>
              <th class="py-3.5 px-2 text-center">S</th>
              <th class="py-3.5 px-2 text-center">M</th>
              <th class="py-3.5 px-2 text-center">L</th>
              <th class="py-3.5 px-2 text-center">XL</th>
              <th class="py-3.5 px-2 text-center">XXL</th>
              <th class="py-3.5 px-2 text-center">3XL</th>
              <th class="py-3.5 px-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800">
            <tr>
              <td colspan="11" class="py-8 text-center text-slate-400">Connecting to live scraper...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // PASTE YOUR CLOUDFLARE WORKER URL HERE:
    const LIVE_PROXY_URL = "https://sports-live-scraper.<YOUR-SUBDOMAIN>.workers.dev";

    let products = [];
    let activeSizeFilter = 'ALL';
    const SIZES = ["S", "M", "L", "XL", "XXL", "3XL"];

    async function fetchLiveData() {
      const badge = document.getElementById('liveBadge');
      badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span> Fetching Live...`;

      try {
        const targetUrl = LIVE_PROXY_URL.includes("<YOUR-SUBDOMAIN>")
          ? './data/products.json?t=' + Date.now()
          : LIVE_PROXY_URL;

        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error("Status " + res.status);
        const data = await res.json();

        products = data.products || (Array.isArray(data) ? data : []);
        document.getElementById('totalCount').innerText = products.length;
        document.getElementById('lastUpdated').innerText = `Live synced: ${new Date().toLocaleTimeString()}`;

        badge.className = "flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Live Connected`;

        applyFilters();
      } catch (err) {
        badge.className = "flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20";
        badge.innerHTML = `Offline / Error`;
        document.getElementById('tableBody').innerHTML = `
          <tr><td colspan="11" class="py-8 text-center text-rose-400">Failed to pull live data: ${err.message}. Make sure LIVE_PROXY_URL is set in index.html.</td></tr>
        `;
      }
    }

    function filterBySize(size) {
      activeSizeFilter = size;
      document.getElementById('filterLabel').innerText = size === 'ALL' ? 'Showing All Sizes' : `Filtering: In Stock in ${size}`;

      document.querySelectorAll('.size-btn').forEach(btn => {
        if (btn.innerText === size) {
          btn.className = "size-btn px-3 py-1 rounded bg-blue-600 text-white font-semibold";
        } else {
          btn.className = "size-btn px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300";
        }
      });

      applyFilters();
    }

    function renderStockBadge(count) {
      const num = Number(count || 0);
      return num > 0
        ? `<span class="text-emerald-400 font-bold">${num}</span>`
        : `<span class="text-rose-500 font-bold">0</span>`;
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="11" class="py-8 text-center text-slate-400">No matching products found for selected filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const curr = item.current_price ? `₹${item.current_price}` : '—';
        const orig = item.original_price ? `<span class="line-through text-slate-400">₹${item.original_price}</span>` : '—';
        const offBadge = item.off
          ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-xs font-semibold">${item.off}</span>`
          : '—';

        const sizeCols = SIZES.map(s => {
          const count = item.sizes ? item.sizes[s] : 0;
          return `<td class="py-3.5 px-2 text-center">${renderStockBadge(count)}</td>`;
        }).join('');

        return `
          <tr class="hover:bg-slate-800/50 transition">
            <td class="py-3.5 px-4 font-semibold text-white">${item.title}</td>
            <td class="py-3.5 px-3 text-emerald-400 font-bold text-sm">${curr}</td>
            <td class="py-3.5 px-3">${orig}</td>
            <td class="py-3.5 px-3">${offBadge}</td>
            ${sizeCols}
            <td class="py-3.5 px-4 text-center">
              <a href="${item.url}" target="_blank" rel="noopener noreferrer"
                 class="inline-block bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-medium transition shadow">
                View
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyFilters() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      let filtered = products.filter(p => {
        const matchesTerm = p.title.toLowerCase().includes(term);
        const matchesSize = (activeSizeFilter === 'ALL') || (p.sizes && Number(p.sizes[activeSizeFilter]) > 0);
        return matchesTerm && matchesSize;
      });

      if (sort === 'price-asc') {
        filtered.sort((a, b) => (Number(a.current_price) || 0) - (Number(b.current_price) || 0));
      } else if (sort === 'price-desc') {
        filtered.sort((a, b) => (Number(b.current_price) || 0) - (Number(a.current_price) || 0));
      } else if (sort === 'discount-desc') {
        filtered.sort((a, b) => {
          const discA = parseInt(a.off?.replace(/\D/g, '') || '0');
          const discB = parseInt(b.off?.replace(/\D/g, '') || '0');
          return discB - discA;
        });
      }

      renderTable(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('sortSelect').addEventListener('change', applyFilters);

    fetchLiveData();
  </script>
</body>
</html>
