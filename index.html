<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Tracker Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold text-white tracking-tight">MFA Sports Product Monitor</h1>
          <span id="syncBadge" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
            Syncing
          </span>
        </div>
        <p class="text-sm text-slate-400">Live 24x7 price & size-level stock inventory</p>
      </div>
      <div id="lastUpdated" class="text-xs text-slate-500 font-mono">
        Last updated: —
      </div>
    </header>

    <!-- Top KPI Counter Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-[#1e293b]/70 border border-slate-700/80 rounded-xl p-5 shadow-lg flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-slate-400 font-medium">Number of products</p>
          <h2 id="totalCount" class="text-3xl font-extrabold text-white mt-1">—</h2>
        </div>
        <div class="p-3 bg-blue-500/10 text-blue-400 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        </div>
      </div>

      <div class="bg-[#1e293b]/70 border border-slate-700/80 rounded-xl p-5 shadow-lg flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-slate-400 font-medium">Newly added products in 1 hour</p>
          <h2 id="newCount" class="text-3xl font-extrabold text-emerald-400 mt-1">—</h2>
        </div>
        <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </div>
      </div>
    </div>

    <!-- Filters & Sorting -->
    <div class="flex flex-col sm:flex-row gap-3">
      <input
        type="text"
        id="searchInput"
        placeholder="Search jerseys, clubs, editions..."
        class="flex-1 px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <select
        id="sortSelect"
        class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="default">Sort By: Default</option>
        <option value="newest">Newly Added First</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="discount-desc">Highest Discount</option>
      </select>
    </div>

    <!-- Table Container -->
    <div class="bg-[#1e293b]/60 border border-slate-700 rounded-xl overflow-hidden shadow-2xl backdrop-blur">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-[#1e293b] uppercase text-xs text-slate-400 tracking-wider border-b border-slate-700">
            <tr>
              <th class="py-3.5 px-4 min-w-[200px]">Product Name</th>
              <th class="py-3.5 px-3">Price</th>
              <th class="py-3.5 px-3">Original</th>
              <th class="py-3.5 px-3">Discount</th>
              <th class="py-3.5 px-2 text-center">S</th>
              <th class="py-3.5 px-2 text-center">M</th>
              <th class="py-3.5 px-2 text-center">L</th>
              <th class="py-3.5 px-2 text-center">XL</th>
              <th class="py-3.5 px-2 text-center">XXL</th>
              <th class="py-3.5 px-2 text-center">3XL</th>
              <th class="py-3.5 px-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800">
            <tr>
              <td colspan="11" class="py-8 text-center text-slate-400">Loading live data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let products = [];
    const SIZES = ["S", "M", "L", "XL", "XXL", "3XL"];

    async function loadData() {
      try {
        const response = await fetch('./data/products.json?t=' + Date.now());
        if (!response.ok) return;
        const data = await response.json();

        const badge = document.getElementById('syncBadge');
        if (data.metadata?.status === "scraping_in_progress") {
          badge.className = "flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20";
          badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span> Live Scraping`;
        } else {
          badge.className = "flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
          badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Up to Date`;
        }

        products = data.products || [];
        document.getElementById('totalCount').innerText = data.metadata?.total_products ?? products.length;
        document.getElementById('newCount').innerText = data.metadata?.new_products_last_hour ?? '0';
        if (data.metadata?.last_updated) {
          document.getElementById('lastUpdated').innerText = `Last updated: ${data.metadata.last_updated}`;
        }

        applyFilters();
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    function renderStockBadge(count) {
      if (count === undefined || count === null) return `<span class="text-slate-500">—</span>`;
      const num = Number(count);
      return num > 0 
        ? `<span class="text-emerald-400 font-bold">${num}</span>` 
        : `<span class="text-rose-500 font-bold">0</span>`;
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="11" class="py-8 text-center text-slate-400">No matching items found.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const curr = item.current_price ? `₹${item.current_price}` : '—';
        const orig = item.original_price ? `<span class="line-through text-slate-400">₹${item.original_price}</span>` : '—';
        const offBadge = item.off 
          ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-xs font-semibold">${item.off}</span>`
          : '—';
        const newBadge = item.is_new 
          ? `<span class="ml-2 bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider">NEW</span>`
          : '';

        const sizeCols = SIZES.map(s => {
          const count = item.sizes ? item.sizes[s] : 0;
          return `<td class="py-3.5 px-2 text-center">${renderStockBadge(count)}</td>`;
        }).join('');

        return `
          <tr class="hover:bg-slate-800/50 transition">
            <td class="py-3.5 px-4 font-semibold text-white">${item.title}${newBadge}</td>
            <td class="py-3.5 px-3 text-emerald-400 font-bold text-sm">${curr}</td>
            <td class="py-3.5 px-3">${orig}</td>
            <td class="py-3.5 px-3">${offBadge}</td>
            ${sizeCols}
            <td class="py-3.5 px-4 text-center">
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                 class="inline-block bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-medium transition shadow">
                View
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyFilters() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      let filtered = products.filter(p => p.title.toLowerCase().includes(term));

      if (sort === 'newest') {
        filtered.sort((a, b) => (b.is_new === true ? 1 : 0) - (a.is_new === true ? 1 : 0));
      } else if (sort === 'price-asc') {
        filtered.sort((a, b) => (Number(a.current_price) || 0) - (Number(b.current_price) || 0));
      } else if (sort === 'price-desc') {
        filtered.sort((a, b) => (Number(b.current_price) || 0) - (Number(a.current_price) || 0));
      } else if (sort === 'discount-desc') {
        filtered.sort((a, b) => {
          const discA = parseInt(a.off?.replace(/\D/g, '') || '0');
          const discB = parseInt(b.off?.replace(/\D/g, '') || '0');
          return discB - discA;
        });
      }

      renderTable(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('sortSelect').addEventListener('change', applyFilters);

    // Initial load
    loadData();

    // Poll every 8 seconds for live progress
    setInterval(loadData, 8000);
  </script>
</body>
</html>
